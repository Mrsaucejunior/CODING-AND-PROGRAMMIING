<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer ></script>
  
  <title>Frontend Mentor | Tip calculator app</title>

</head>
<body>

  <header>
    <img src="./images/logo.svg" alt="splitter icon">
  </header>

  <main>
    <form novalidate>
      <section class="bill-tip-section">
        <div id="billSection"  class="bill-section">
          <h2>Bill</h2>
          <input type="text" id="bill" class="bill active-input test-input">
        </div>

        <div class="tip-section">
          <h2>Select Tip %</h2>
          <div class="btn-inputs">
            <button class="select-btn">5%</button>
            <button class="select-btn">10%</button>
            <button class="select-btn">15%</button>
            <button class="select-btn">25%</button>
            <button class="select-btn">50%</button>

            <input type="text" placeholder="Custom" id="customTip" class="custom-tip select-btn active-input">
          </div>

        </div>

        <div class="num-of-people-section">
          <div class="num-of-people-header">
          <h2>Number of People</h2>
          <p id="errorMsg" class="error-msg">Can't be zero</p>
          </div>
          <input type="text" id="numOfPeople" class="num-of-people active-input">
        </div>
      </section>


      <section class="tip-cal-section">
        <div>
          <div class="tip-eval">
            <p>Tip Amount <br>
              <span class="per-person">/ person</span>
            </p>
            <p id="tipPerPerson" class="amount">$0.00</p>
          </div>

          <div class="tip-eval">
            <p>Total <br>
              <span class="per-person">/ person</span>
            </p>
            <p id="totalPerPerson"  class="amount">$0.00</p>
          </div>
        </div>  

        <button id="resetBtn" class="reset-btn">reset</button>
  
      </section>
    </form>
  </main>  

  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">JubyDev</a>.
    </div>
  </footer>

</body>
</html>
